toolOutput:
  completeOutput: true
  # This is used as a way to read subfolder from the exec_directory ( qual_<uuid> )
  subFolder:
  # Used just in one place, read_qualification_metric_file
  # The only file that is read from raw_metrics is application_information.csv
  metricsSubFolder: qual_core_output/raw_metrics
  textFormat:
    # Used in the _generate_recommended_configs_report
    # File is read and configs are appended and files is rewritten
    # Don't know if this is relevant post auto-tuner??
    summaryLog:
      fileName: rapids_4_spark_qualification_output.log
    log4jFileName: rapids_4_spark_qualification_stderr.log
  csv:
    unsupportedOperatorsReport:
      fileName: rapids_4_spark_qualification_output_unsupportedOperators.csv
    clusterInformation:
      fileName: rapids_4_spark_qualification_output_cluster_information.csv
    stagesInformation:
      fileName: rapids_4_spark_qualification_output_stages.csv
    execsInformation:
      fileName: rapids_4_spark_qualification_output_execs.csv
    tunings:
      subFolder: tuning
    appsStatusReport:
        fileName: rapids_4_spark_qualification_output_status.csv
    summaryReport:
      fileName: rapids_4_spark_qualification_output.csv
      columns:
        - Vendor
        - Driver Host
        - Cluster Id
        - Cluster Name
        - App Name
        - App ID
        - Estimated GPU Speedup
        - Estimated GPU Duration
        - App Duration
        - SQL Stage Durations Sum
        - Unsupported Operators Stage Duration
        - Unsupported Operators Stage Duration Percent
        - Total Core Seconds
      mapColumns:
      groupColumns:
         enabled: false
         keys:
           - Vendor
           - Driver Host
           - Cluster Id
           - Cluster Name
           - App Name
         aggregate:
           - column: App Duration
             function: 'mean'
           - column: Estimated GPU Duration
             function: 'mean'
           - column: Unsupported Operators Stage Duration
             function: 'mean'
           - column: Skip by Heuristics
             function: 'any'
           - column: SQL Stage Durations Sum
             function: 'mean'
      dropDuplicates:
        - Vendor
        - Driver Host
        - Cluster Id
        - Cluster Name
        - App Name
sparkRapids:
  mvnUrl: 'https://repo1.maven.org/maven2/com/nvidia/rapids-4-spark-tools_2.12'
  repoUrl: '{}/{}/rapids-4-spark-tools_2.12-{}.jar'
  toolsJarRegex: 'rapids-4-spark-tools_2.12-.*.jar'
  mainClass: 'com.nvidia.spark.rapids.tool.qualification.QualificationMain'
  outputDocURL: 'https://docs.nvidia.com/spark-rapids/user-guide/latest/qualification/quickstart.html#qualification-output'
  enableAutoTuner: true
  requireEventLogs: true
  # _process_custom_args processes these params
  # gpu, device, workersPerNide, cudaVersion
  # I could not find the usage of these post setting
  # them in the context once
  gpu:
    device: 't4'
    workersPerNode: 2
    cudaVersion: '11.5'
  cli:
    # did not find the usage of this costSavingsSettings
    # not even the use of the toggle
    defaults:
      costSavingsSettings: #temporrary settings to control the code behavior until the cost savings feature is fully removed
        enabled: false
    toolOptions:
      - all
      - any
      - a
      - application-name
      - f
      - filter-criteria
      - fs-end-time
      - fs-start-time
      - h
      - html-report
      - no-html-report
      - m
      - match-event-logs
      - min-event-log-size
      - max-event-log-size
      - max-sql-desc-length
      - ml-functions
      - n
      - no-recursion
      - num-output-rows
      - order
      - r
      - report-read-schema
      - s
      - spark-property
      - speedup-factor-file
      - start-app-time
      - t
      - timeout
      - u
      - user-name
local:
  output:
    cleanUp: true
    # Local:output:files is consumed during _process_output
    # A dictionary of user_tools related files(summary, statistics) created
    # Folders that do not exist are created
    files:
      summary:
        name: qualification_summary.csv
        outputComment: "Summarized speedups CSV report"
      statistics:
        name: qualification_statistics.csv
        outputComment: "Statistics CSV report"
        columns:
          - 'App ID'
          - 'SQL ID'
          - 'Operator'
          - 'Count'
          - 'Stage Task Exec Duration(s)'
          - 'Total SQL Task Duration(s)'
          - '% of Total SQL Task Duration'
          - 'Supported'
      intermediateOutput:
        name: 'intermediate_output'
        outputComment: "Intermediate output generated by tools"
        isDirectory: true
        files:
          heuristics:
            name: 'heuristics_info.csv'
            outputComment: "Heuristics information"
      configRecommendations:
        name: 'rapids_4_spark_qualification_output/tuning'
        columns:
          - 'Full Cluster Config Recommendations*'
          - 'GPU Config Recommendation Breakdown*'
      appMetadata:
        name: app_metadata.json
        outputComment: "Metadata file with cluster recommendation and tuning details"
        columns:
          - 'App ID'
          - 'App Name'
          - 'Event Log'
          - 'Cluster Info'
          - 'Spark Runtime'
          - 'Estimated GPU Speedup Category'
          - 'Full Cluster Config Recommendations*'
          - 'GPU Config Recommendation Breakdown*'
      appsStatusReport:
        name: 'rapids_4_spark_qualification_output/rapids_4_spark_qualification_output_status.csv'
        outputComment: "Application status report"
    # No usage costcolumns in the code
    costColumns:
      - 'Savings Based Recommendation'
      - 'Estimated App Cost'
      - 'Estimated GPU Cost'
      - 'Estimated GPU Savings(%)'
      - 'Estimated Job Frequency (monthly)'
      - 'Annual Cost Savings'
    # No usage of savingColumn in the code
    savingColumn: 'Estimated GPU Savings(%)'
    savingRecommendColumn: 'Savings Based Recommendation'
    # Not used anymore in qual code - summaryColumns
    summaryColumns: #columns to be displayed on the stdout as part of the final report
      savingsReportEnabledTrue: #columns with savings estimates enabled
        - 'App ID'
        - 'App Name'
        - 'Savings Based Recommendation'
        - 'App Duration'
        - 'Estimated GPU Duration'
        - 'Estimated GPU Speedup'
        - 'Estimated GPU Savings(%)'
      savingsReportEnabledFalse: #columns with savings estimates disabled
        - 'App ID'
        - 'App Name'
        - 'App Duration'
        - 'Estimated GPU Duration'
        - 'Estimated GPU Speedup'
    # Used in _gen_output_tree which bubbles up to _process_output
    # generate_report()
    treeDirectory:
      enabled: true
      depthLevel: 2
      indentation: '    '
      excludedPatterns:
        directories:
          - '^(css)$'
          - '^(js)$'
          - '^(assets)$'
          - '.+\$$'
          - '^.+(_\$folder\$)$'
        files:
          - '^(\.+).*'
          - '^(\$+).*'
          - '^.+(_\$folder\$)$'
          - '^rapids_4_spark_qualification_output.*'
    # Mask, inputColumns, groupingColumns, resultColumnName, percentResultColumnName
    # These are used during heuristic processing
    # mask is used as means to filter out which rows to consider
    # during unsupported ops percentage calculation
    unsupportedOperators:
      mask:
        - operator: 'NOT_EQUAL'
          columnName: 'Action'
          value: 'IgnoreNoPerf'
        - operator: 'NOT_EQUAL'
          columnName: 'Unsupported Type'
          value: 'Expr'
        - operator: 'NOT_EQUAL'
          columnName: 'Stage ID'
          value: -1
      inputColumns:
        - 'App ID'
        - 'App Duration'
        - 'Stage ID'
        - 'Stage Duration'
      groupingColumns:
        max:
          - 'App ID'
          - 'App Duration'
          - 'Stage ID'
        sum:
          - 'App ID'
          - 'App Duration'
      resultColumnName: 'Unsupported Operators Stage Duration'
      percentResultColumnName: 'Unsupported Operators Stage Duration Percent'
    # All the columns in the context of the top candidates
    # seem relevant to the final report including Core Threshold
    # There was a debate if we want to move the core threshold
    # to heuristic part and not have it just in the top candidates
    topCandidates:
      categoryColumnName: 'Estimated GPU Speedup Category'
      outputColumns:
        - 'App ID'
        - 'App Name'
        - 'Estimated GPU Speedup Category'
        - 'Qualified Cluster Recommendation'
        - 'Full Cluster Config Recommendations*'
        - 'GPU Config Recommendation Breakdown*'
      ineligibleCategory:
        - 'Not Recommended'
      eligibleCategories:
        - 'Small'
        - 'Medium'
        - 'Large'
      sortingColumns:
        - 'Speedup Category Order'
        - 'Total Core Seconds'
        - 'Unsupported Operators Stage Duration Percent'
      joinColumns:
        - 'App ID'
        - 'App Name'
        - 'App Duration'
      summaryReport:
        compactWidth: true
        timeUnits: 's'
        columnWidth: 14
      totalCoreSecCol: 'Total Core Seconds'
      # This is total core seconds of an 8-core machine running for 24 hours
      totalCoreSecThreshold: !ENV ${RAPIDS_USER_TOOLS_CORE_SECONDS_THRESHOLD:691200}
    # Both speedupCategories and additionalHeuristics
    # are relevant. They are used in post processing, once predicted
    # speedups are available. The speedupCategories are used as a way to
    # add brackets. Additional heuristics mainly for controlling
    # spill thresholds and unsupported operators
    speedupCategories:
      speedupColumnName: 'Estimated GPU Speedup'
      categoryColumnName: 'Estimated GPU Speedup Category'
      heuristicsColumnName: 'Skip by Heuristics'
      sparkRuntimeColumnName: 'Spark Runtime'
      defaultCategory: 'Not Recommended'
      strategies:
        spark:  # Spark specific speedup categories
          categories:
            - title: 'Not Applicable'
              lowerBound: -1000000.0
              upperBound: 1.3
            - title: 'Small'
              lowerBound: 1.3
              upperBound: 2.0
            - title: 'Medium'
              lowerBound: 2.0
              upperBound: 3.0
            - title: 'Large'
              lowerBound: 3.0
              upperBound: 1000000.0
          eligibilityConditions:
            - columnName: 'Estimated GPU Speedup'
              lowerBound: !ENV ${RAPIDS_USER_TOOLS_GPU_SPEEDUP_SPARK_LOWER_BOUND:1.3}
              upperBound: !ENV ${RAPIDS_USER_TOOLS_GPU_SPEEDUP_SPARK_UPPER_BOUND:1000000.0}
              skippingReason: 'GPU SpeedUp < Qualifying Threshold (More is qualified)'
            - columnName: 'Unsupported Operators Stage Duration Percent'
              lowerBound: !ENV ${RAPIDS_USER_TOOLS_UNSUPPORTED_OPERATORS_SPARK_LOWER_BOUND:0.0}
              upperBound: !ENV ${RAPIDS_USER_TOOLS_UNSUPPORTED_OPERATORS_SPARK_UPPER_BOUND:25.0}
              skippingReason: 'Unsupported Operators Stage Duration Percent > Qualifying Threshold (Less is qualified)'
        photon:  # Photon specific speedup categories
          categories:
            - title: 'Not Applicable'
              lowerBound: -1000000.0
              upperBound: 1.0  # Lower threshold than Spark since Photon is faster and smaller speedups are valuable
            - title: 'Small'
              lowerBound: 1.0
              upperBound: 2.0
            - title: 'Medium'
              lowerBound: 2.0
              upperBound: 3.0
            - title: 'Large'
              lowerBound: 3.0
              upperBound: 1000000.0
          eligibilityConditions:
            - columnName: 'Estimated GPU Speedup'
              lowerBound: !ENV ${RAPIDS_USER_TOOLS_GPU_SPEEDUP_PHOTON_LOWER_BOUND:1.0}
              upperBound: !ENV ${RAPIDS_USER_TOOLS_GPU_SPEEDUP_PHOTON_UPPER_BOUND:1000000.0}
              skippingReason: 'GPU SpeedUp < Qualifying Threshold (Less is qualified)'
            - columnName: 'Unsupported Operators Stage Duration Percent'
              lowerBound: !ENV ${RAPIDS_USER_TOOLS_UNSUPPORTED_OPERATORS_PHOTON_LOWER_BOUND:0.0}
              upperBound: !ENV ${RAPIDS_USER_TOOLS_UNSUPPORTED_OPERATORS_PHOTON_UPPER_BOUND:25.0}
              skippingReason: 'Unsupported Operators Stage Duration Percent > Qualifying Threshold (Less is qualified)'
    additionalHeuristics:
      appInfo:
        fileName: 'application_information.csv'
      resultCols:
        - 'App ID'
        - 'Skip by Heuristics'
        - 'Not Recommended Reason'
      spillBased:
        stageAggMetrics:
          fileName: 'stage_level_aggregated_task_metrics.csv'
          columns:
            - 'stageId'
            - 'memoryBytesSpilled_sum'
        sqlToStageInfo:
          fileName: 'sql_to_stage_information.csv'
          columns:
            - 'stageId'
            - 'SQL Nodes(IDs)'
        spillThresholdBytes: !ENV ${RAPIDS_USER_TOOLS_SPILL_BYTES_THRESHOLD:1099511627776}
        allowedExecs:
          - 'Aggregate'
          - 'Join'
          - 'Sort'
    # This is used in the predict method for rendering the intermdiate
    # prediction output. All the files mentioned are created first
    # and then dumped into the directory.
    predictionModel:
      outputDirectory: 'xgboost_predictions'
      files:
        features:
          name: 'features.csv'
        perSql:
          name: 'per_sql.csv'
        perApp:
          name: 'per_app.csv'
        shapValues:
          name: 'shap_values.csv'
        featureImportance:
          name: 'feature_importance.csv'
      # This is used post prediction output, to rename the columns
      # As well as extracting just a subset of columns
      updateResult:
        subsetColumns:
          - 'appId'
          - 'speedup'
          - 'appDuration_pred'
        remapColumns:
          - srcCol: 'speedup'
            dstCol: 'Estimated GPU Speedup'
          - srcCol: 'appDuration_pred'
            dstCol: 'Estimated GPU Duration'
    clusterInference:
      cpuClusterColumns:
        - 'Num Worker Nodes'
        - 'Worker Node Type'
        - 'Cores Per Executor'
      gpuClusterColumns:
        - 'Recommended Num Worker Nodes'
        - 'Recommended Worker Node Type'
        - 'Recommended Cores Per Executor'

# This is used in create work_dir to create the qual_<uuid>
platform:
  shortName: 'qual'
  outputDir: qual-tool-output
  cleanUp: true
